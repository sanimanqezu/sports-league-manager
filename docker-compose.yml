services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sports-league-app
    ports:
    - 8080:8080
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: sports_league
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    restart: on-failure
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
